<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rdGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f58529"/>
      <stop offset="35%" stop-color="#dd2a7b"/>
      <stop offset="70%" stop-color="#8134af"/>
      <stop offset="100%" stop-color="#515bd4"/>
    </linearGradient>
    <filter id="rdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Base Rounded Container with Instagram Brand Gradient -->
  <rect width="64" height="64" rx="16" fill="url(#rdGrad)"/>
  
  <!-- Crisp Center Reels Emblem -->
  <g filter="url(#rdGlow)">
    <!-- Reel Camera Frame -->
    <rect x="14" y="14" width="36" height="36" rx="9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Film Dots -->
    <circle cx="21" cy="20.5" r="1.75" fill="#ffffff"/>
    <circle cx="43" cy="20.5" r="1.75" fill="#ffffff"/>
    
    <!-- Center Play Icon -->
    <path d="M28 25.5 L39.5 32 L28 38.5 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>